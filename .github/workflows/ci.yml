name: TorneAR CI

# Se ejecuta en cada Pull Request hacia main (Producción) y develop (Staging),
# y también al pushear directo a esas ramas. Si cualquier paso falla, el check
# queda en rojo y (con branch protection activada) bloquea el merge del PR.
#
# Un cambio que SÓLO toca documentación (docs/, README.md, CLAUDE.md) no corre
# ni el quality ni pgTAP: no hay código ni schema que validar. Si el PR mezcla
# documentación con cualquier otro archivo, corre entero.
# ⚠️ Si algún día se activa branch protection con estos checks como
# obligatorios, `paths-ignore` a nivel workflow deja los PRs de sólo docs
# esperando un check que nunca llega: habría que pasar el filtro a nivel job
# (los jobs salteados cuentan como aprobados).
on:
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CLAUDE.md'
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CLAUDE.md'

# Cancela corridas anteriores del mismo PR/rama para no gastar minutos de más.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type check · Lint · Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      # npm ci = install reproducible desde package-lock.json (falla si está desincronizado).
      - name: Install dependencies
        run: npm ci

      # 1) TypeScript en modo estricto, sin emitir. Falla ante cualquier error de tipos.
      - name: Type Check (tsc)
        run: npx tsc --noEmit

      # 2) ESLint (config de Expo). Falla ante errores de lint.
      - name: Lint (eslint)
        run: npm run lint

      # 3) Suite de tests (Vitest, una sola corrida). Falla si algún test no pasa.
      - name: Tests (vitest)
        run: npm test

  # ─── Fingerprint nativo: esta rama contra su base ───────────────────────────
  # Falla si el PR cambia el nativo SIN subir `version` en app.json. Con la
  # política `appVersion` eso deja al JS nuevo compartiendo runtime con los
  # binarios viejos: el OTA les llega, no tienen el módulo y la app no arranca.
  #
  # ⚠️ Compara rama contra base, NO contra el build publicado, y la diferencia
  # es deliberada. `eas build` sube el working copy local, que en la máquina de
  # release vive con CRLF (`core.autocrlf=true` en Windows); el fingerprint
  # hashea contenido, así que el mismo árbol da un hash distinto en un runner de
  # Linux. Comparar contra un build desde acá da rojo SIEMPRE, haya o no cambios
  # nativos (verificado el 15/09/2026). Esa comparación es válida en la máquina
  # que publica, y ahí es donde corre — a mano, antes de `eas update`
  # (docs/WORKFLOW.md §1). Este job es la red de atrás, no el chequeo principal.
  #
  # Sin EXPO_TOKEN ni red: los dos lados se calculan con el `@expo/fingerprint`
  # que fija package-lock.json. Por eso también corre en PRs desde forks. Y como
  # los dos árboles se hashean igual, se miran las dos plataformas: un archivo
  # sin versionar (`google-services.json`) falta en ambos lados por igual.
  native-fingerprint:
    name: Fingerprint nativo (rama vs base)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      # fetch-depth 0: hace falta el commit base para materializarlo abajo.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      # El fingerprint hashea los módulos nativos de node_modules: sin install
      # no hay nada que medir. Hacen falta los dos árboles instalados, porque
      # una dependencia nativa nueva se ve justamente ahí.
      - name: Install dependencies
        run: npm ci

      # Worktree y no `git checkout`: el script vive en ESTA rama y en la base
      # puede no existir todavía (es el caso del PR que lo agrega).
      - name: Materializar la base en un worktree
        run: git worktree add ../base ${{ github.event.pull_request.base.sha }}

      - name: Install dependencies (base)
        working-directory: ../base
        run: npm ci

      # Se invoca el archivo y NO un script de package.json: los scripts de
      # package.json forman parte del fingerprint (`android`/`ios` contienen
      # `expo run:*`), así que agregar uno movería el hash que este job mide y
      # el chequeo fallaría por su propia herramienta.
      - name: Comparar el nativo contra la base
        run: node scripts/check-native-fingerprint.mjs --against ../base

  # ─── Tests de base de datos (pgTAP · stack efímero) ─────────────────────────
  # Levanta un stack local de Supabase DESDE CERO en el runner (aplica las
  # migraciones completas + supabase/seed_testing.sql) y corre las suites declarativas
  # de supabase/tests/ con pg_prove (supabase test db). Ventajas sobre el job
  # legacy: hermético (no toca la base real ni compite entre PRs), corre en
  # forks sin secrets, y valida en cada PR que la cadena de migraciones
  # aplica limpia desde cero.
  #
  # -x excluye los servicios que los tests de DB no usan (studio, buckets,
  # realtime, edge functions, mail, analytics...). Quedan corriendo Postgres,
  # auth y kong. OJO: los nombres válidos dependen de la versión del CLI
  # (`supabase start --help`); `gotrue` no es excluible y `logflare` se
  # llama `analytics`.
  #
  # pgTAP y el schema tests.* los instala supabase/tests/000-setup.sql al
  # inicio de la corrida — nunca via migración, así jamás llegan a Producción.
  db-tests-pgtap:
    name: Database tests (pgTAP · stack efímero)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Versión PINEADA a propósito: 010-schema.spec.sql afirma la matriz de
      # privilegios de authenticated con table_privs_are (exact-match), y el
      # baseline de default privileges de Supabase varía entre versiones del
      # CLI. Con `latest`, una actualización de Supabase rompería esos tests
      # sin que cambiara nuestro schema (version-skew). Al subir de versión,
      # re-medir los arrays de 010-schema contra el nuevo baseline.
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Start ephemeral stack (migraciones + seed)
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,functions,realtime,storage,analytics,vector,meta,rest

      - name: Run pgTAP suites (supabase test db)
        run: supabase test db
